name: Build custom APK

on:
  push:
    branches: [ cursor-and-shortcut-swipes ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-custom
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Publish APK as a new release (older builds are kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${GITHUB_RUN_NUMBER}"
          APK="HeliBoard-custom-build-${N}.apk"
          cp app/build/outputs/apk/debug/*-debug*.apk "$APK"
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.txt
          gh release create "build-${N}" "$APK" \
            --target "$GITHUB_SHA" --latest \
            --title "Build ${N} - $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes-file notes.txt

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
